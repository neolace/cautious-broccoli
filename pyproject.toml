[project]
name = "jessie"
version = "0.1.0"
description = "Convert JPG, JPEG and PNG images into multi-resolution Windows .ico files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "l4t3nc1" }]
dependencies = ["pillow>=10.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
jessie = "jessie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jessie"]

# ---------- Ruff: linting + formatting ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "PL",       # pylint
    "RUF",      # ruff-specific
    "D",        # pydocstyle
]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------- Mypy: static typing ----------
[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

# ---------- Pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=jessie --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["jessie"]
